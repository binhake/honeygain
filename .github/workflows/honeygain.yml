name: Honeygain Auto Claimer

on:
  schedule:
    # Runs at 00:05 UTC (07:05 AM UTC+7) every day
    - cron: '5 0 * * *'
  workflow_dispatch:
    # Enables manual trigger button on GitHub Actions tab

jobs:
  claim:
    name: Claim Lucky Pot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Honeygain Claim Script
        env:
          HONEYGAIN_EMAIL: ${{ secrets.HONEYGAIN_EMAIL }}
          HONEYGAIN_PASSWORD: ${{ secrets.HONEYGAIN_PASSWORD }}
          HONEYGAIN_TOKEN: ${{ secrets.HONEYGAIN_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run claim
